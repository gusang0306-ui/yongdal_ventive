<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>용달 운행 계획서</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
    @media print {
      body { background-color: white !important; color: black !important; }
      .no-print { display: none !important; }
      .print-border { border: 1px solid #ccc !important; }
      .card-box { border: 1px solid #ddd !important; box-shadow: none !important; background: white !important; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-16">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40 no-print">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🚚</span>
        <h1 class="text-xl font-bold text-white tracking-tight">용달 운행 계획서</h1>
        <span id="save-badge" class="text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full ml-2">자동 저장됨</span>
      </div>
      <div class="flex flex-wrap items-center gap-2 text-sm">
        <button onclick="loadSampleData()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 transition">
          📂 예시 불러오기
        </button>
        <button onclick="resetData()" class="bg-slate-800 hover:bg-rose-900/50 text-slate-300 hover:text-rose-200 px-3 py-1.5 rounded-lg border border-slate-700 transition">
          🗑️ 초기화
        </button>
        <button onclick="copyKakaoText()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold px-3.5 py-1.5 rounded-lg transition shadow-sm">
          💬 카톡 요약 복사
        </button>
        <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-3.5 py-1.5 rounded-lg transition">
          🖨️ 인쇄 / PDF
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-6 space-y-6">

    <!-- Project Overview Section -->
    <section class="card-box bg-slate-900 border border-slate-800 rounded-2xl p-5 md:p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
        <h2 class="text-lg font-bold text-slate-100 flex items-center gap-2">
          <span>🎬</span> 작품 및 운행 기본 정보
        </h2>
        <button onclick="saveOverview()" class="no-print text-xs bg-indigo-600/30 hover:bg-indigo-600 text-indigo-300 hover:text-white border border-indigo-500/40 px-3 py-1 rounded-md transition">
          수정사항 저장
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 text-sm">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">작품명</label>
          <input type="text" id="title" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="예: 사랑에 빠진 딸기">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">담당자 (PD/연락처)</label>
          <input type="text" id="contact" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="예: 이수연 PD (010-4272-5072)">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">이용 기간</label>
          <input type="text" id="period" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="예: 2026.11.05 ~ 2026.11.08">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">탑승 예정자</label>
          <input type="text" id="passengers" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="예: 이승현 / 윤성주">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">이용 차량</label>
          <input type="text" id="vehicle" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="예: 스타리아 / 포터">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">예상 견적</label>
          <input type="text" id="budget" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="예: 500,000원 (장비 보관비 포함)">
        </div>
      </div>
    </section>

    <!-- Schedule List Section -->
    <section class="card-box bg-slate-900 border border-slate-800 rounded-2xl p-5 md:p-6 shadow-xl space-y-4">
      <div class="flex justify-between items-center pb-2 border-b border-slate-800">
        <h2 class="text-lg font-bold text-slate-100 flex items-center gap-2">
          <span>📍</span> 회차별 운행 상세 일정
        </h2>
        <button onclick="addScheduleRow()" class="no-print bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition flex items-center gap-1">
          <span>+</span> 일정 추가
        </button>
      </div>

      <div id="schedule-container" class="space-y-4">
        <!-- Schedule cards inserted dynamically -->
      </div>
    </section>

  </main>

  <script>
    const sampleData = {
      overview: {
        title: "사랑에 빠진 딸기",
        contact: "이수연 PD (010-4272-5072)",
        period: "2026.11.05 ~ 2026.11.08",
        passengers: "이승현 / 윤성주",
        vehicle: "스타리아 / 포터 (미술팀 포터)",
        budget: "500,000원 (장비 보관비 포함)"
      },
      schedules: [
        {
          date: "2026.11.05 (목)",
          round: "0회차",
          type: "출발",
          time: "상차 후 이동",
          location: "빌리지 렌탈 (서울 마포구 동교동 203-15)",
          passenger: "-",
          note: "도착: X (장비 보관)"
        },
        {
          date: "2026.11.06 (금)",
          round: "1회차",
          type: "도착/출발",
          time: "07:00 도착 / 23:00 종료 예정",
          location: "가정집 로케이션 (서울 서대문구 북가좌동 80-84) ➡️ 골목길 (북가좌동 362-1)",
          passenger: "이승현 동승",
          note: "도착: X (장비 보관)"
        },
        {
          date: "2026.11.07 (토)",
          round: "2회차",
          type: "이동",
          time: "시간 미정",
          location: "면목동 골목길 (미정)",
          passenger: "이승현 동승",
          note: "도착: X (장비 보관)"
        },
        {
          date: "2026.11.08 (일)",
          round: "3회차",
          type: "도착/반납",
          time: "05:00 도착 / 23~24시 철수",
          location: "스튜디오 3월 2일 (서울 양천구 가로공원로 105) ➡️ 빌리지 렌탈",
          passenger: "이승현 동승",
          note: "빌리지 렌탈 최종 반납 후 종료"
        }
      ]
    };

    let currentData = { overview: {}, schedules: [] };

    function init() {
      const saved = localStorage.getItem('yongdal_data');
      if (saved) {
        try {
          currentData = JSON.parse(saved);
        } catch (e) {
          currentData = JSON.parse(JSON.stringify(sampleData));
        }
      } else {
        currentData = JSON.parse(JSON.stringify(sampleData));
      }
      renderOverview();
      renderSchedules();
    }

    function saveToStorage() {
      localStorage.setItem('yongdal_data', JSON.stringify(currentData));
      const badge = document.getElementById('save-badge');
      badge.textContent = '저장 완료!';
      setTimeout(() => { badge.textContent = '자동 저장됨'; }, 1500);
    }

    function renderOverview() {
      document.getElementById('title').value = currentData.overview.title || '';
      document.getElementById('contact').value = currentData.overview.contact || '';
      document.getElementById('period').value = currentData.overview.period || '';
      document.getElementById('passengers').value = currentData.overview.passengers || '';
      document.getElementById('vehicle').value = currentData.overview.vehicle || '';
      document.getElementById('budget').value = currentData.overview.budget || '';
    }

    function saveOverview() {
      currentData.overview = {
        title: document.getElementById('title').value,
        contact: document.getElementById('contact').value,
        period: document.getElementById('period').value,
        passengers: document.getElementById('passengers').value,
        vehicle: document.getElementById('vehicle').value,
        budget: document.getElementById('budget').value
      };
      saveToStorage();
    }

    function renderSchedules() {
      const container = document.getElementById('schedule-container');
      container.innerHTML = '';

      if (currentData.schedules.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">등록된 일정이 없습니다. '+ 일정 추가' 버튼을 눌러 추가하세요.</div>`;
        return;
      }

      currentData.schedules.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = "bg-slate-950 border border-slate-800 rounded-xl p-4 relative space-y-3";
        card.innerHTML = `
          <div class="flex flex-wrap justify-between items-center gap-2 border-b border-slate-800 pb-2">
            <div class="flex items-center gap-2">
              <span class="bg-indigo-500/20 text-indigo-300 font-bold text-xs px-2.5 py-1 rounded-md border border-indigo-500/30">${item.round || '회차'}</span>
              <input type="text" value="${item.date || ''}" onchange="updateSchedule(${index}, 'date', this.value)" class="bg-transparent text-sm font-semibold text-slate-200 focus:outline-none focus:border-indigo-500 border-b border-transparent" placeholder="날짜 (예: 11/05 목)">
            </div>
            <button onclick="deleteSchedule(${index})" class="no-print text-xs text-rose-400 hover:text-rose-300 px-2 py-1 rounded hover:bg-rose-950/40 transition">삭제</button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 text-sm">
            <div>
              <label class="block text-xs text-slate-500 mb-0.5">구분</label>
              <input type="text" value="${item.type || ''}" onchange="updateSchedule(${index}, 'type', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200 text-xs" placeholder="예: 출발 / 도착">
            </div>
            <div>
              <label class="block text-xs text-slate-500 mb-0.5">시간</label>
              <input type="text" value="${item.time || ''}" onchange="updateSchedule(${index}, 'time', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200 text-xs" placeholder="예: 07:00 까지">
            </div>
            <div>
              <label class="block text-xs text-slate-500 mb-0.5">동승자</label>
              <input type="text" value="${item.passenger || ''}" onchange="updateSchedule(${index}, 'passenger', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200 text-xs" placeholder="예: 이승현 동승">
            </div>
            <div class="md:col-span-2">
              <label class="block text-xs text-slate-500 mb-0.5">장소 / 상세 주소</label>
              <div class="flex gap-2">
                <input type="text" value="${item.location || ''}" onchange="updateSchedule(${index}, 'location', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200 text-xs" placeholder="상세 주소 입력">
                <button onclick="copyAddress('${item.location}')" class="no-print whitespace-nowrap bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2.5 py-1.5 rounded border border-slate-700">복사</button>
              </div>
            </div>
            <div>
              <label class="block text-xs text-slate-500 mb-0.5">비고 / 장비보관</label>
              <input type="text" value="${item.note || ''}" onchange="updateSchedule(${index}, 'note', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200 text-xs" placeholder="예: 장비 보관">
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateSchedule(index, field, value) {
      currentData.schedules[index][field] = value;
      saveToStorage();
    }

    function addScheduleRow() {
      currentData.schedules.push({
        date: "",
        round: `${currentData.schedules.length}회차`,
        type: "",
        time: "",
        location: "",
        passenger: "",
        note: ""
      });
      renderSchedules();
      saveToStorage();
    }

    function deleteSchedule(index) {
      if (confirm('이 일정을 삭제하시겠습니까?')) {
        currentData.schedules.splice(index, 1);
        renderSchedules();
        saveToStorage();
      }
    }

    function loadSampleData() {
      if (confirm('예시 데이터로 되돌리시겠습니까? 작성 중인 내용이 대체됩니다.')) {
        currentData = JSON.parse(JSON.stringify(sampleData));
        renderOverview();
        renderSchedules();
        saveToStorage();
      }
    }

    function resetData() {
      if (confirm('모든 데이터를 초기화하고 빈 양식으로 시작하시겠습니까?')) {
        currentData = {
          overview: { title: "", contact: "", period: "", passengers: "", vehicle: "", budget: "" },
          schedules: []
        };
        renderOverview();
        renderSchedules();
        saveToStorage();
      }
    }

    function copyAddress(text) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        alert('주소가 복사되었습니다: ' + text);
      });
    }

    function copyKakaoText() {
      saveOverview();
      const o = currentData.overview;
      let msg = `[용달 운행 요청] 작품명: ${o.title || '미정'}\n`;
      msg += `담당자: ${o.contact || '-'}\n`;
      msg += `차량: ${o.vehicle || '-'}\n`;
      msg += `견적: ${o.budget || '-'}\n\n`;
      msg += `[회차별 운행 동선]\n`;

      currentData.schedules.forEach(s => {
        msg += `• ${s.date} (${s.round}): ${s.location} [${s.time}] (${s.passenger})\n`;
      });

      navigator.clipboard.writeText(msg).then(() => {
        alert('카카오톡 전송용 요약 문구가 복사되었습니다! 카톡창에 붙여넣기(Ctrl+V) 하세요.');
      });
    }

    // Auto save overview changes
    ['title', 'contact', 'period', 'passengers', 'vehicle', 'budget'].forEach(id => {
      document.getElementById(id).addEventListener('input', saveOverview);
    });

    window.onload = init;
  </script>
</body>
</html>
